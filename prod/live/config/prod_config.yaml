# Temporal
temporal:
  address: "localhost:7233"         # cpu-pipeline-01 runs Temporal server locally
  namespace: "default"
  postgres_uri: "postgresql://temporal:temporal@localhost:5432/temporal"

# Worker concurrency
worker:
  max_concurrent_cpu: 8             # PyMuPDF, tree, regex, formatting, S3 IO
  max_concurrent_gpu: 4             # chandra + text LLM

# SQS ingestion (Phase 3)
ingestion:
  queue_url: ""                     # SQS queue URL, set after queue creation
  poll_interval_s: 5
  visibility_timeout_s: 300

# Pipeline overlay applied on top of pipeline/config/pipeline_config.yaml.
# Only carries scale-run deltas from the base — vision + tree_llm URLs, s3
# paths, and model ids all live in the base config. Workers resolve
# `vllm-instance://` URLs at activity boundary via EC2 tag lookup
# (shared/vllm/resolve.py), driven by OCR_VLLM_PREFER_PRIVATE_IP set in the
# worker's systemd unit.
pipeline_overrides:
  output:
    save_page_images: false         # skip full-page renders on scale runs

# EC2 instance tags (informational; not read by code — the actual instance
# types live in shared/vllm/terraform/variables.tf var.models).
instances:
  cpu:
    name: "ocr-bench-cpu-pipeline-01"
    type: "m7i.xlarge"
  gpu_chandra:
    name: "ocr-bench-vllm-chandra"
    type: "g6.xlarge"               # L4 24GB — dedicated chandra OCR.
  gpu_gemma:
    name: "ocr-bench-vllm-gemma"
    type: "g6e.xlarge"              # L40S 48GB — dedicated gemma tree_llm, 128K context.
