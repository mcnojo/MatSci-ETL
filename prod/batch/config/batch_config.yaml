# Batch-mode configuration. Live config governs the always-on streaming service;
# this file governs bounded bulk-job runs.

temporal:
  address: "localhost:7233"
  namespace: "default"

# Per-PDF trees go under pipeline storage.s3; reports land under this root.
# Batch reports → {root}/batches/{batch_id}/report/, live reports →
# {root}/live/reports/{window_iso}/, comparisons → {root}/comparisons/{ts}/.
report:
  s3_root: "s3://chem-lit-artifacts"

# Sharding
planner:
  shard_size: 50                    # items per ShardWorkflow

# Workflow-layer concurrency caps. Real throughput ceiling is the worker's
# max_concurrent_activities; these caps prevent thundering-herd at workflow start.
concurrency:
  shards_in_flight: 8               # ShardWorkflow children in parallel
  pdfs_per_shard_in_flight: 8       # ProcessPdfWorkflow children per shard

# Fleet — consumed by `cli submit` which plumbs these values into BatchRunInput.
# Phase C: the workflow owns the lifecycle (scale up, await pollers, scale down)
# inside the try/finally — no operator babysitting required. Workflow scales
# each ASG straight to *max_workers* (option 2: skip per-batch sizing math).
# Both ASGs are CPU instances; gpu-task-queue workers are HTTP proxies to vLLM.
fleet:
  region: "us-west-2"
  cpu_queue_asg_name: "ocr-batch-cpu-queue"
  gpu_queue_asg_name: "ocr-batch-gpu-queue"
  cpu_queue_max_workers: 2          # must match terraform cpu_queue_max_size
  gpu_queue_max_workers: 2          # must match terraform gpu_queue_max_size
  worker_registration_timeout_s: 600
  vllm_role_tag: "vllm-batch"       # vllm_resolve.py picks endpoints by role
