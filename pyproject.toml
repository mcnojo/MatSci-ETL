[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-benchmarking"
version = "0.1.0"
description = "OCR benchmarking + scientific-paper ETL pipeline."
requires-python = ">=3.9"
# Base: deps every motif needs (workflows, HTTP clients, AWS, PDF/image basics).
# Excludes the heavy CV/ML stack so workers that only serve LLM HTTP traffic
# (batch GPU ASG) install a slim env — the heavy stack lives in pipeline-cpu.
dependencies = [
    # ─ PDF / images
    "pymupdf>=1.24.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",

    # ─ Layout/OCR baseline used by the CPU pipeline only (the wrappers are
    # light; the binary deps that make them heavy live in pipeline-cpu).
    "huggingface-hub>=0.20.0",
    "pytesseract>=0.3.10",
    "tabula-py>=2.9.0",

    # ─ LLM clients (vLLM/OpenAI-compatible + cloud providers)
    # litellm gives one call site across providers; instructor wraps it to return
    # validated Pydantic models (replacing hand-rolled JSON extract + retry).
    "openai>=2.36.0",
    "anthropic>=0.40.0",
    "litellm>=1.55.0",
    "instructor>=1.6.0",
    "tiktoken>=0.7.0",

    # ─ Chunker: Rust-core paragraph→sentence→word cascade with tiktoken-aware
    # token budgeting + overlap. Replaces the prior in-tree splitter.
    "semantic-text-splitter>=0.32.0",

    # ─ Config / schema
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # ─ AWS
    "boto3>=1.35.0",

    # ─ Qdrant (dense + BM25-sparse chunk store for hybrid RAG).
    # fastembed supplies the BM25 sparse encoder (Qdrant/bm25); dense vectors
    # keep coming from bge-m3 via the chandra vLLM /embeddings endpoint.
    "qdrant-client>=1.12.0",
    "fastembed>=0.5.0",

    # ─ Workflow orchestration
    "temporalio>=1.27.0",

    # ─ Async / utilities
    "anyio>=4.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# vLLM server. Installed only on the vLLM host.
serve = ["vllm>=0.24,<0.25"]

# Heavy CV/ML stack pulled by load_pages/extract_assets/assign_elements/finalize
# (the CPU lane activities) and any worker that registers a workflow which
# imports them transitively. ~3-4 GB on disk (torch + nvidia-* CUDA wheels) and
# requires libxcb + libGL system libs for cv2 — keep off the GPU lane host.
# Hosts that need it: cpu-pipeline-01 (live worker + batch control worker —
# both register workflows that import the CPU activities chain), the batch
# CPU ASG, and any local hybrid worker (`--queues control,cpu,gpu`).
pipeline-cpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "doclayout-yolo>=0.0.4",
    "opencv-python-headless>=4.8.0",
    "camelot-py[cv]>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "pipeline*", "prod*", "vllm*", "preprocessing*"]
exclude = ["env*", "docs*", "data*", "test_hard*"]
