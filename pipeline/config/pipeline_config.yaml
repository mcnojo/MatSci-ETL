# LLM for tree building (text-based, not vision).
# Provider: openai (default; targets any OpenAI-compatible endpoint, including
# vLLM's chat-completions API) or anthropic (uses the native SDK).
# prompt_style: "local" (elaborated for small open models) | "upstream" (verbatim
# VectifyAI/PageIndex prompts, tuned for stronger cloud models).

## Anthropic swap (uncomment to use)
# tree_llm:
#   provider: anthropic
#   model: "claude-sonnet-4-5"
#   model_fast: "claude-haiku-4-5"
#   api_key_env: "ANTHROPIC_API_KEY"
#   prompt_style: upstream
#   max_response_tokens: 8192

tree_llm:
  provider: openai
  model: "google/gemma-4-12b-it"                # mainline 12B (not the E4B edge variant); stronger JSON-schema conformance under vLLM guided decoding. Must match shared/vllm var.models["gemma"].hf_model_id.
  model_fast: "google/gemma-4-12b-it"           # same box for both — no separate fast/strong split under this model.
  base_url: "vllm-instance://gemma:8005/v1"     # resolved by shared/vllm/resolve.py (EC2 tag vllm_role_gemma=true)
  api_key_env: null                             # no key needed for in-VPC vLLM
  prompt_style: local
  max_response_tokens: 16384                    # 8192 truncated real TOC generations once the schema stopped accepting empty responses; 16384 fits worst-case section counts on long review papers.
  # temp=0 + guided decoding never samples the close-array branch → runaway.
  # 1.0/0.95/64 per Gemma-4's RLHF-tuned distribution.
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 64

# Vision server — element-crop OCR. Provider dispatch inside vision_ocr_call:
#   chandra_vllm — datalab-to/chandra-ocr-2 on an OpenAI-compat vLLM box.
#   openai       — GPT-4o family; prompt-elicited into the same output shape.
#   anthropic    — Claude 4.5+ vision; routed via litellm.
# Prompt (shared/prompts/vision) is provider-selected; parser accepts either
# layout_html or figure_analysis output from any provider.
vision_server:
  provider: chandra_vllm
  base_url: "vllm-instance://chandra:8004/v1"   # resolved by shared/vllm/resolve.py (EC2 tag vllm_role_chandra=true)
  api_key: "EMPTY"                              # vLLM default
  ocr_model: "datalab-to/chandra-ocr-2"
  max_response_tokens: 8192

## Lab-model swap (uncomment ONE block; keep tree_llm on the same lane to avoid mixed motif)
# vision_server:
#   provider: openai
#   ocr_model: "gpt-4o"
#   api_key_env: "OPENAI_API_KEY"
#   max_response_tokens: 4096
# vision_server:
#   provider: anthropic
#   ocr_model: "claude-sonnet-4-5"
#   api_key_env: "ANTHROPIC_API_KEY"
#   max_response_tokens: 4096

# Tree building
tree:
  toc_check_pages: 25
  max_pages_per_node: 10
  max_tokens_per_node: 48000          # group-text input budget. Larger chunks -> fewer fragmentation seams between tree nodes. Budget per call: 48K chunk + accumulated TOC + ~3K prompt + 16K response ≈ 67K, well inside gemma's 128K window.
  add_node_summary: true
  add_node_id: true
  add_doc_description: false
  summary_overlap_pages: 1            # adjacent pages included as context (boundary disambiguation; not summarized)
  verify_summaries: true              # fast-model fidelity check + 1 retry on missed topics

# Layout detection (doclayout-yolo)
layout:
  model_path: null                    # null = use doclayout-yolo default
  confidence_threshold: 0.25
  iou_threshold: 0.45
  target_classes:
    - "figure"
    - "table"
    - "figure_caption"
    - "table_caption"
    - "isolate_formula"

# Page rendering
rendering:
  dpi: 200
  ocr_dpi: 300
  page_format: "PNG"

# Enrichment
enrichment:
  run_ocr: true
  run_chem_entity_extraction: true
  max_concurrent_enrichments: 4
  figure_aware_resummarize: true      # post-enrichment Stage E: re-summarize nodes with figure data (no new OCR calls)

# Output — active artifact root.
# `kb_root` is the tree.json destination; `assets_uri_prefix` is where
# AssetExtractor publishes element PNGs (and page PNGs when save_page_images=true).
# Cross-worker reads go through shared.s3_io.get_bytes, which routes s3:// natively.
# The prod overlay flips save_page_images to false for scale runs.
output:
  kb_root: "s3://chem-lit-artifacts/trees"
  save_page_images: true
  pretty_print_json: true
  assets_uri_prefix: "s3://chem-lit-artifacts/assets"

# Embedding server (OpenAI-compatible /embeddings endpoint). Consumed by
# IndexDocumentWorkflow's embed_chunks activity. dimension is validated
# against the model's actual output; a mismatch fails fast so a mis-set
# index mapping never silently corrupts vectors.
# The `embed` role is co-hosted on the chandra vLLM box (shared/vllm terraform's
# var.models.chandra.secondary_services). vllm-instance://embed:8006/v1
# resolves to the chandra box IP via the `vllm_role_embed=true` EC2 tag.
embedding_server:
  base_url: "vllm-instance://embed:8006/v1"    # resolved by shared/vllm/resolve.py (EC2 tag vllm_role_embed=true)
  api_key: "EMPTY"
  model: "BAAI/bge-m3"
  dimension: 1024
  batch_size: 64

# Indexing — dense + BM25-sparse chunk store on Qdrant Cloud.
# This repo owns the WRITE path only; retrieval belongs to the downstream
# agent (see docs/vector-and-bm25-access.md).
#
# `index_enabled` gates the auto-index tail after OCR (ProcessPdfWorkflow /
# BatchRunWorkflow). Set false to run OCR alone; re-index later via
# `python -m prod.batch.cli submit-index` (batch) or
# `python -m pipeline.cli index <tree_uri>` (live).
#
# URL + API key resolve from the env vars named below (worker bootstrap
# materializes them from SSM SecureString). Rotate collection_name when
# swapping embedding_server.model — vector dim is baked at collection create.
retrieval:
  index_enabled: true
  qdrant:
    url_env: "QDRANT_URL"
    api_key_env: "QDRANT_API_KEY"
    collection_name: "chem-lit-chunks-v1"
    prefer_grpc: false                    # HTTP works on every Cloud tier
  chunking:
    max_tokens: 512
    overlap_tokens: 64
