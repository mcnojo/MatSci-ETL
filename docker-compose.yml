services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      # 2 MB -> 16 MB blob ceiling; see shared/temporal/dynamicconfig.yaml.
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/overrides.yaml
    volumes:
      - ./shared/temporal/dynamicconfig.yaml:/etc/temporal/config/overrides.yaml:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "0.0.0.0:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"

volumes:
  pgdata:
