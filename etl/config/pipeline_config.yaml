# LLM for tree building (text-based, not vision)
# Provider: auto-detected from base_url (:11434 -> ollama, else -> openai),
# or set explicitly. prompt_style: "local" for small open models, "upstream"
# for strong cloud models (verbatim VectifyAI/PageIndex prompts).


## OpenAI ──
# tree_llm:
#   provider: openai
#   model: "gpt-4o"
#   model_fast: "gpt-4o-mini"
#   base_url: "https://api.openai.com/v1"
#   api_key_env: "OPENAI_API_KEY"
#   prompt_style: upstream
#   max_response_tokens: 8192
#

## Anthropic
# tree_llm:
#   provider: anthropic
#   model: "claude-sonnet-4-5"
#   model_fast: "claude-haiku-4-5"
#   api_key_env: "ANTHROPIC_API_KEY"
#   prompt_style: upstream
#   max_response_tokens: 8192

tree_llm:
  provider: ollama                            # ollama | openai | anthropic (optional; auto-detected from base_url)
  model: "gemma4:e4b-mlx"                     # strong model: structure generation, TOC transformation
  model_fast: "gemma4:e4b-mlx"                # fast model: TOC detection, verification, summaries
  base_url: "http://localhost:11434/v1"       # Ollama's OpenAI-compatible endpoint
  api_key_env: null                           # no key needed for local
  prompt_style: local                         # local (elaborated) | upstream (verbatim PageIndex)
  num_ctx: 32768                              # Ollama context window (input + output tokens). e4b supports 128K.
  max_response_tokens: 8192                   # cloud response cap (OpenAI/Anthropic max_tokens); ignored by Ollama

# Vision server (OCR model, any OpenAI-compatible endpoint)
# Works with vLLM, Ollama, MLX, or any server exposing /v1/chat/completions
vision_server:
  base_url: "vllm-instance://chandra:8004/v1"   # resolved by shared/vllm/resolve.py (EC2 tag role=vllm-chandra-<env>)
  api_key: "EMPTY"                              # vLLM default
  ocr_model: "datalab-to/chandra-ocr-2"

# Tree building
tree:
  toc_check_pages: 25
  max_pages_per_node: 10
  max_tokens_per_node: 48000          # group-text input budget. Larger chunks → fewer fragmentation seams between tree nodes. Budget per call: 48K chunk + accumulated TOC + ~3K prompt + 16K response ≈ 67K, well inside gemma's 128K window.
  add_node_summary: true
  add_node_id: true
  add_doc_description: false
  summary_overlap_pages: 1            # adjacent pages included as context (boundary disambiguation; not summarized)
  verify_summaries: true              # fast-model fidelity check + 1 retry on missed topics

# Layout detection (doclayout-yolo)
layout:
  model_path: null                    # null = use doclayout-yolo default
  confidence_threshold: 0.25
  iou_threshold: 0.45
  target_classes:
    - "figure"
    - "table"
    - "figure_caption"
    - "table_caption"
    - "isolate_formula"

# Page rendering
rendering:
  dpi: 200
  ocr_dpi: 300
  page_format: "PNG"

# Enrichment
enrichment:
  run_ocr: true
  run_chem_entity_extraction: true
  max_concurrent_enrichments: 4
  figure_aware_resummarize: true      # post-enrichment Stage E: re-summarize nodes with figure data (no new OCR calls)

# Storage backend (scaffolding for the future S3 cutover — see shared/storage/)
# NOTE: the active code path still reads output.kb_root below. The S3Store /
# LocalStore abstraction in shared/storage exists but no caller uses it yet;
# once activities are updated to take URIs, create_store() will read this block.
storage:
  backend: "local"
  local:
    root: "../kb"                      # relative paths anchored to this config file's dir → etl/kb
  s3:
    bucket: "chem-lit-artifacts"
    prefix: ""
    region: null                       # null = use AWS_DEFAULT_REGION / instance profile

# Output — active artifact root (read by activities + asset_extractor)
# Relative paths are anchored to this config file's directory at load time
# (see shared/config_loader.py), so `../kb` here resolves to `etl/kb/`
# regardless of the worker's CWD.
output:
  kb_root: "../kb"
  save_page_images: true
  pretty_print_json: true
  # Where AssetExtractor publishes element + page PNGs so cross-worker consumers
  # (e.g. GPU chandra activity) can read them via shared.s3_io. In local dev this
  # is a path on disk — get_bytes/put_bytes route to the filesystem. Prod overlay
  # replaces this with an s3:// URI so files survive the CPU→GPU machine boundary.
  # Relative paths are anchored at load time (shared/config_loader.py).
  assets_uri_prefix: "../kb"
